<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animovaná Tiskárna</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .printer-container {
            position: relative;
            width: 400px;
            height: 200px;
        }

        .printer {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #333, #444);
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .printer-slot {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 2px;
            background: #222;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .paper {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 75%;
            height: 0;
            background: white;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            transition: height 1s ease-out;
            bottom: 42px;
            border-radius: 3px 3px 0 0;
        }

        .printer-status {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #32cd32;
            box-shadow: 0 0 10px #32cd32;
        }

        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        .button {
            padding: 8px 15px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .button:hover {
            background: #1976D2;
        }

        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .printed-papers {
            position: absolute;
            bottom: 20px;
            left: calc(100% + 20px);
            display: flex;
            flex-direction: row-reverse;
            align-items: flex-end;
            gap: 5px;
            max-width: 600px;
            flex-wrap: wrap-reverse;
            padding: 10px;
        }

        .printed-paper {
            width: 300px;
            min-height: 80px;
            background: white;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            border-radius: 3px;
            transition: transform 0.5s;
            transform-origin: bottom left;
            position: relative;
        }

        .printed-paper:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .printer-text {
            font-size: 14px;
            color: #666;
            padding: 10px;
            word-wrap: break-word;
        }

        .text-input {
            width: 200px;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .printer-error {
            color: red;
            font-size: 12px;
            margin-top: 5px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .printer.jammed .printer-status {
            background: #ff4444;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .printing .printer-status {
            background: #ff8c00;
            animation: blink 1s infinite;
        }

        .timestamp {
            font-size: 10px;
            color: #999;
            position: absolute;
            bottom: 5px;
            right: 5px;
        }
    </style>
</head>
<body>
    <div class="printer-container">
        <div class="printer">
            <div class="printer-status"></div>
            <div class="control-panel">
                <input type="text" class="text-input" id="text-input" placeholder="Zadejte text k tisku...">
                <button class="button" id="print-btn">Tisknout</button>
                <button class="button" id="clear-btn">Vyčistit</button>
                <div class="printer-error" id="printer-error">Tiskárna je zahlcena papíry!</div>
            </div>
            <div class="printer-slot"></div>
            <div class="paper" id="current-paper"></div>
        </div>
        <div class="printed-papers" id="printed-papers"></div>
    </div>

    <script>
        const printer = document.querySelector('.printer');
        const currentPaper = document.getElementById('current-paper');
        const printedPapers = document.getElementById('printed-papers');
        const printBtn = document.getElementById('print-btn');
        const clearBtn = document.getElementById('clear-btn');
        const textInput = document.getElementById('text-input');
        const printerError = document.getElementById('printer-error');
        let isPrinting = false;
        let paperCount = 0;
        const MAX_PAPERS = 12;

        function getCurrentTimestamp() {
            const now = new Date();
            return now.toISOString().replace('T', ' ').substring(0, 19);
        }

        function printPaper() {
            const text = textInput.value.trim();
            if (isPrinting || !text) return;
            
            if (printedPapers.children.length >= MAX_PAPERS) {
                printer.classList.add('jammed');
                printerError.style.opacity = '1';
                return;
            }

            isPrinting = true;
            printer.classList.add('printing');
            printerError.style.opacity = '0';

            // Animace vysouvání papíru
            currentPaper.style.height = '100px';

            setTimeout(() => {
                // Vytvoření vytištěného papíru
                const printedPaper = document.createElement('div');
                printedPaper.className = 'printed-paper';
                
                // Přidání textu na papír
                const paperText = document.createElement('div');
                paperText.className = 'printer-text';
                paperText.textContent = text;
                printedPaper.appendChild(paperText);

                // Přidání časového razítka
                const timestamp = document.createElement('div');
                timestamp.className = 'timestamp';
                timestamp.textContent = getCurrentTimestamp();
                printedPaper.appendChild(timestamp);

                // Přidání papíru do stacku
                printedPapers.insertBefore(printedPaper, printedPapers.firstChild);

                // Reset současného papíru
                currentPaper.style.height = '0';
                textInput.value = '';

                printer.classList.remove('printing');
                isPrinting = false;
                paperCount++;

                // Kontrola zahlcení
                if (printedPapers.children.length >= MAX_PAPERS) {
                    printer.classList.add('jammed');
                    printerError.style.opacity = '1';
                }
            }, 1000);
        }

        function clearPapers() {
            while (printedPapers.firstChild) {
                printedPapers.removeChild(printedPapers.firstChild);
            }
            paperCount = 0;
            printer.classList.remove('jammed');
            printerError.style.opacity = '0';
        }

        printBtn.addEventListener('click', printPaper);
        clearBtn.addEventListener('click', clearPapers);
        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                printPaper();
            }
        });
    </script>
</body>
</html>
